[versions]
# Kotlin JVM Gradle plugin. Latest stable confirmed via Gradle Plugin Portal (2026-08-11).
kotlin = "2.4.10"
# Shadow (fat-jar / relocate) plugin. Latest stable confirmed via Gradle Plugin Portal (2026-08-11).
shadow = "9.6.1"
# run-paper (integration test server) plugin.
# NOTE: 3.1.0 is the latest published version, but its release notes state it
# "Requires Gradle 9.7+". This project pins the Gradle wrapper to 9.6, so we
# intentionally stay on 3.0.2 (no stated Gradle floor) instead of 3.1.0.
runPaper = "3.0.2"
# Paper API. Exact literal version string confirmed by fetching
# https://repo.papermc.io/repository/maven-public/io/papermc/paper/paper-api/maven-metadata.xml
# and taking the newest "-stable" build in the 26.1.2 line.
paperApi = "26.1.2.build.74-stable"
# WorldEdit public API (Bukkit platform), from the EngineHub Maven repository.
# NOTE: FAWE 2.15.3 does NOT declare a versioned com.sk89q.worldedit:worldedit-bukkit
# dependency in its published POM (FastAsyncWorldEdit-Core/-Bukkit 2.15.3) - it is a
# source fork that bundles its own com.sk89q.worldedit.* implementation rather than
# depending on a released WorldEdit artifact. There is therefore no POM-derived
# "matching" WorldEdit version to pin. 7.4.5 is the latest actual release published
# on maven.enginehub.org (confirmed to exist and resolve) and is used as the public
# API surface to compile against, consistent with design doc SS4.2/SS35 (FAWE maintains
# WorldEdit API compatibility). This is a documented judgement call - see report.
worldeditBukkit = "7.4.5"
# SQLite JDBC driver. Latest stable confirmed via Maven Central metadata.
sqliteJdbc = "3.53.2.1"
# JUnit 5 (Jupiter/Platform/Vintage) BOM. Latest 5.x line release confirmed via
# Maven Central metadata (org.junit:junit-bom). Note: JUnit project also publishes a
# JUnit 6.x line (unified versioning successor of the same Platform/Jupiter/Vintage
# project, latest 6.1.3) but 5.x is used here to match the design doc's literal
# "JUnit 5" requirement.
junitBom = "5.14.4"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paperApi" }
worldedit-bukkit = { module = "com.sk89q.worldedit:worldedit-bukkit", version.ref = "worldeditBukkit" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqliteJdbc" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junitBom" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "runPaper" }
